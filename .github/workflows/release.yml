name: Release

# ADR-0011: per-OS portable archives + npm package, fired on tag push.
# CI (.github/workflows/ci.yml) still gates merges on lint/typecheck/build.
# This workflow only runs on tags so a normal push never publishes.

on:
  push:
    tags:
      # Jarela app release (root package.json -> @circuitwall/jarela).
      - "v*"
      # Standalone workspace packages â€” each tag prefix maps to one job below.
      - "atlassian-langchain-v*"
      - "jira-align-langchain-v*"
      - "github-langchain-v*"
      - "ms-todo-langchain-v*"
      - "icloud-langchain-v*"
permissions:
  contents: write   # softprops/action-gh-release attaches archives to the Release
  packages: write   # ghcr.io publication for GitHub Packages card
  id-token: write   # npm provenance

jobs:
  release-security:
    name: Release security gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/

      - name: Audit runtime dependency CVEs
        run: npm audit --omit=dev --audit-level=high

      - name: Audit full dependency graph
        run: npm audit --audit-level=moderate

      - name: Verify npm package signatures
        run: npm audit signatures

      - name: Audit OAuth proxy dependencies
        working-directory: proxy
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high

  bundle:
    name: Bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: release-security
    # Only the Jarela app release fans out to the multi-OS bundle / GitHub
    # Release / npm-publish / docker pipeline. Standalone workspace packages
    # are published by the per-package jobs at the bottom of this file.
    if: startsWith(github.ref_name, 'v')
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin
            archive: tar.gz
          - os: ubuntu-latest
            target: linux
            archive: tar.gz
          - os: windows-latest
            target: win
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build (next build â†’ standalone)
        run: npm run build
        # The Windows GitHub runner image ships legacy junctions
        # (C:\Users\runneradmin\Application Data, AppData\Local\Application
        # Data) that deny `scandir` for non-elevated processes. Webpack's
        # snapshot/glob walks via HOME/USERPROFILE and trips on them, failing
        # the build with `EPERM`. Point HOME/USERPROFILE at the runner's temp
        # dir so the walk never enters the profile tree.
        env:
          HOME: ${{ runner.temp }}
          USERPROFILE: ${{ runner.temp }}

      - name: Resolve version + bundle name
        id: meta
        shell: bash
        run: |
          # Strip leading "v" from the tag â†’ version. Falls back to package.json
          # if for some reason the tag does not match (shouldn't happen â€” the
          # workflow trigger is `v*`).
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [ -z "$version" ]; then
            version="$(node -p "require('./package.json').version")"
          fi
          name="jarela-${version}-${{ matrix.target }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Stage bundle (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          dest="dist/${{ steps.meta.outputs.name }}"
          mkdir -p "$dest/.next" "$dest/scripts"
          cp -R .next/standalone "$dest/.next/standalone"
          cp -R .next/static     "$dest/.next/static"
          cp -R public           "$dest/public"
          cp package.json        "$dest/package.json"
          cp LICENSE             "$dest/LICENSE"
          cp README.md           "$dest/README.md"
          cp scripts/install-to-system.sh "$dest/scripts/"
          cp docs/INSTALL.md     "$dest/INSTALL.md"
          chmod +x "$dest/scripts/install-to-system.sh"

      - name: Stage bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = "dist/${{ steps.meta.outputs.name }}"
          New-Item -ItemType Directory -Force -Path "$dest/.next" | Out-Null
          New-Item -ItemType Directory -Force -Path "$dest/scripts" | Out-Null
          Copy-Item -Recurse -Force .next/standalone "$dest/.next/standalone"
          Copy-Item -Recurse -Force .next/static     "$dest/.next/static"
          Copy-Item -Recurse -Force public           "$dest/public"
          Copy-Item              -Force package.json "$dest/package.json"
          Copy-Item              -Force LICENSE      "$dest/LICENSE"
          Copy-Item              -Force README.md    "$dest/README.md"
          Copy-Item -Force docs/INSTALL.md           "$dest/INSTALL.md"
          $winScripts = @(
            'install-to-system.ps1',
            'installed-launcher.ps1',
            'installed-launcher.vbs',
            'install-tailscale-serve.ps1',
            'uninstall-tailscale-serve.ps1',
            'uninstall-from-system.ps1'
          )
          foreach ($s in $winScripts) {
            Copy-Item -Force "scripts/$s" "$dest/scripts/$s"
          }

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "dist/${{ steps.meta.outputs.name }}.tar.gz" \
              -C dist "${{ steps.meta.outputs.name }}"

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path "dist/${{ steps.meta.outputs.name }}/*" `
                           -DestinationPath "dist/${{ steps.meta.outputs.name }}.zip" `
                           -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: dist/${{ steps.meta.outputs.name }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attach archives to GitHub Release
    runs-on: ubuntu-latest
    needs: bundle
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/jarela-*.tar.gz
            dist/jarela-*.zip
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true

  npm-publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: bundle
    # Gated by JARELA_NPM_PUBLISH so a fork (or this repo before npm Trusted
    # Publishing is configured) doesn't try and fail. Auth uses npm's
    # Trusted Publisher / OIDC flow â€” no NPM_TOKEN required. See the npm
    # org's Trusted Publishers settings:
    # https://www.npmjs.com/settings/circuitwall/trusted-publishers
    # Configuration there must list:
    #   publisher       = GitHub Actions
    #   organization    = CircuitWall
    #   repository      = jarela
    #   workflow        = release.yml
    if: ${{ vars.JARELA_NPM_PUBLISH == 'true' }}
    permissions:
      contents: read
      id-token: write   # required for OIDC + npm provenance / trusted publish
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm (Trusted Publishers needs >= 11.5)
        # Node 22 ships npm 10.x, which doesn't speak the OIDC `npm publish`
        # flow npm rolled out for Trusted Publishers in 2025. Without an
        # auth header the PUT goes out unauthenticated and the registry
        # masks the 401 as `404 'is not in this registry'` â€” that's why
        # every tagged release before this fix failed at the publish step.
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build standalone bundle for npm package
        run: npm run build
        env:
          # Keep client chunks readable in the npm tarball to reduce
          # false-positive obfuscation alerts from supply-chain scanners.
          JARELA_DISABLE_CLIENT_MINIFICATION: "1"

      - name: Verify npm tarball contains runnable standalone bundle
        run: npm run test:package

      - name: Verify version matches tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Publish (with provenance)
        run: npm publish --provenance --access public

  # Per-arch native build. The previous single-job approach used QEMU to
  # cross-compile linux/arm64 on an x86_64 runner â€” `npm ci` + `next build`
  # under user-mode emulation took ~25 min on its own. We now fan out to
  # one native runner per arch and merge the resulting digests into a
  # single multi-arch manifest in `docker-manifest`.
  docker-build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: bundle
    if: ${{ vars.JARELA_DOCKER_PUBLISH == 'true' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch_tag: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch_tag: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package.json version $pkg" >&2
            exit 1
          fi
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          repo="${{ vars.JARELA_DOCKER_REPO || 'andrewgewu/jarela' }}"
          ghcr_repo="${{ vars.JARELA_GHCR_REPO || '' }}"
          if [ -z "$ghcr_repo" ]; then
            ghcr_repo="ghcr.io/${owner}/jarela"
          fi
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
          echo "repo=$repo"   >> "$GITHUB_OUTPUT"
          echo "ghcr_repo=$ghcr_repo" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          # Push by digest only â€” no tag is set here. The manifest job
          # below assembles the human-readable tags after both arches
          # have published their digests.
          outputs: type=image,name=${{ steps.meta.outputs.repo }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=Jarela
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.arch_tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch_tag }}

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch_tag }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: Publish to Docker Hub (manifest)
    runs-on: ubuntu-latest
    needs: docker-build
    if: ${{ vars.JARELA_DOCKER_PUBLISH == 'true' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          repo="${{ vars.JARELA_DOCKER_REPO || 'andrewgewu/jarela' }}"
          ghcr_repo="${{ vars.JARELA_GHCR_REPO || '' }}"
          if [ -z "$ghcr_repo" ]; then
            ghcr_repo="ghcr.io/${owner}/jarela"
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "repo=$repo"   >> "$GITHUB_OUTPUT"
          echo "ghcr_repo=$ghcr_repo" >> "$GITHUB_OUTPUT"

      - name: Compute tag flags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          v="${{ steps.meta.outputs.version }}"
          r="${{ steps.meta.outputs.repo }}"
          tags="-t $r:$v"
          # Skip moving tags for prereleases (e.g. 0.1.0-rc.1).
          case "$v" in
            *-*) ;;
            *)
              major="${v%%.*}"
              rest="${v#*.}"
              minor="${rest%%.*}"
              tags="$tags -t $r:$major.$minor -t $r:$major -t $r:latest"
              ;;
          esac
          echo "flags=$tags" >> "$GITHUB_OUTPUT"

      - name: Compute GHCR tag flags
        id: ghcr-tags
        shell: bash
        run: |
          set -euo pipefail
          v="${{ steps.meta.outputs.version }}"
          r="${{ steps.meta.outputs.ghcr_repo }}"
          tags="-t $r:$v"
          case "$v" in
            *-*) ;;
            *)
              major="${v%%.*}"
              rest="${v#*.}"
              minor="${rest%%.*}"
              tags="$tags -t $r:$major.$minor -t $r:$major -t $r:latest"
              ;;
          esac
          echo "flags=$tags" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          r="${{ steps.meta.outputs.repo }}"
          # shellcheck disable=SC2046
          docker buildx imagetools create ${{ steps.tags.outputs.flags }} \
            $(printf "$r@sha256:%s " *)

      - name: Inspect image
        run: |
          set -euo pipefail
          docker buildx imagetools inspect \
            "${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.version }}"

      - name: Mirror image to GHCR
        run: |
          set -euo pipefail
          docker buildx imagetools create ${{ steps.ghcr-tags.outputs.flags }} \
            "${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.version }}"

      - name: Inspect GHCR image
        run: |
          set -euo pipefail
          docker buildx imagetools inspect \
            "${{ steps.meta.outputs.ghcr_repo }}:${{ steps.meta.outputs.version }}"


  # ── Standalone workspace package publishing ──────────────────────────────
  # Each package has its own tag prefix (see on.push.tags at top of file).
  # The job that matches the tag runs `npm publish` from inside that
  # package directory. All three rely on npm Trusted Publishers / OIDC —
  # no NPM_TOKEN. Register each package on npmjs.com with:
  #   publisher    = GitHub Actions
  #   organization = CircuitWall
  #   repository   = jarela
  #   workflow     = release.yml
  # Different `environment` is not required; the workflow-name+repo match
  # is enough for npm to mint a publish token for any of the three.

  publish-atlassian-langchain:
    name: Publish @circuitwall/atlassian-langchain
    runs-on: ubuntu-latest
    needs: release-security
    if: startsWith(github.ref_name, 'atlassian-langchain-v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm (Trusted Publishers needs >= 11.5)
        run: npm install -g npm@latest
      - name: Install dependencies (workspaces)
        run: npm install --no-audit --no-fund
      - name: Build package
        run: npm run build -w @circuitwall/atlassian-langchain
      - name: Verify version matches tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#atlassian-langchain-v}"
          pkg="$(node -p "require('./packages/atlassian-langchain/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package version $pkg" >&2
            exit 1
          fi
      - name: Publish (with provenance)
        working-directory: packages/atlassian-langchain
        run: npm publish --provenance --access public

  publish-jira-align-langchain:
    name: Publish @circuitwall/jira-align-langchain
    runs-on: ubuntu-latest
    needs: release-security
    if: startsWith(github.ref_name, 'jira-align-langchain-v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm (Trusted Publishers needs >= 11.5)
        run: npm install -g npm@latest
      - name: Install dependencies (workspaces)
        run: npm install --no-audit --no-fund
      - name: Build package
        run: npm run build -w @circuitwall/jira-align-langchain
      - name: Verify version matches tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#jira-align-langchain-v}"
          pkg="$(node -p "require('./packages/jira-align-langchain/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package version $pkg" >&2
            exit 1
          fi
      - name: Publish (with provenance)
        working-directory: packages/jira-align-langchain
        run: npm publish --provenance --access public

  publish-github-langchain:
    name: Publish @circuitwall/github-langchain
    runs-on: ubuntu-latest
    needs: release-security
    if: startsWith(github.ref_name, 'github-langchain-v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm (Trusted Publishers needs >= 11.5)
        run: npm install -g npm@latest
      - name: Install dependencies (workspaces)
        run: npm install --no-audit --no-fund
      - name: Build package
        run: npm run build -w @circuitwall/github-langchain
      - name: Verify version matches tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#github-langchain-v}"
          pkg="$(node -p "require('./packages/github-langchain/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package version $pkg" >&2
            exit 1
          fi
      - name: Publish (with provenance)
        working-directory: packages/github-langchain
        run: npm publish --provenance --access public

  publish-ms-todo-langchain:
    name: Publish @circuitwall/ms-todo-langchain
    runs-on: ubuntu-latest
    needs: release-security
    if: startsWith(github.ref_name, 'ms-todo-langchain-v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm (Trusted Publishers needs >= 11.5)
        run: npm install -g npm@latest
      - name: Install dependencies (workspaces)
        run: npm install --no-audit --no-fund
      - name: Build package
        run: npm run build -w @circuitwall/ms-todo-langchain
      - name: Verify version matches tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#ms-todo-langchain-v}"
          pkg="$(node -p "require('./packages/ms-todo-langchain/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package version $pkg" >&2
            exit 1
          fi
      - name: Publish (with provenance)
        working-directory: packages/ms-todo-langchain
        run: npm publish --provenance --access public

  publish-icloud-langchain:
    name: Publish @circuitwall/icloud-langchain
    runs-on: ubuntu-latest
    needs: release-security
    if: startsWith(github.ref_name, 'icloud-langchain-v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm (Trusted Publishers needs >= 11.5)
        run: npm install -g npm@latest
      - name: Install dependencies (workspaces)
        run: npm install --no-audit --no-fund
      - name: Build package
        run: npm run build -w @circuitwall/icloud-langchain
      - name: Verify version matches tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#icloud-langchain-v}"
          pkg="$(node -p "require('./packages/icloud-langchain/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package version $pkg" >&2
            exit 1
          fi
      - name: Publish (with provenance)
        working-directory: packages/icloud-langchain
        run: npm publish --provenance --access public
