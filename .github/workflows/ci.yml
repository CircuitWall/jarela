name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        # package-lock.json is gitignored (see ADR / commit history) so we
        # cannot use `npm ci`. `npm install` resolves fresh against the
        # public registry on every run.
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (next build)
        run: npm run build

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    env:
      # Force an ephemeral data dir so the suite never touches a user's
      # ~/.jarela. /tmp is writable on ubuntu-latest and wiped between runs.
      JARELA_DB_DIR: /tmp/jarela-ci
      # Tests target the started server on this port.
      JARELA_URL: http://127.0.0.1:4312
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Start production server
        run: |
          mkdir -p "$JARELA_DB_DIR"
          nohup npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for /api/v1/health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$JARELA_URL/api/v1/health" >/dev/null; then
              echo "server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy in 60s"
          tail -n 200 server.log || true
          exit 1

      - name: Run live integration tests (no LLM)
        run: npm run test:live

      - name: Server log on failure
        if: failure()
        run: tail -n 400 server.log || true

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) 2>/dev/null || true
          fi

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    env:
      JARELA_DB_DIR: /tmp/jarela-e2e
      JARELA_E2E_BASE_URL: http://127.0.0.1:4312
      # The mock provider replaces real LLM calls so we don't need keys in CI.
      JARELA_ENABLE_MOCK_PROVIDER: "1"
      JARELA_DISABLE_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Resolve Playwright version
        id: pw
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright system deps (cache-hit branch)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Build
        run: npm run build

      - name: Start production server
        run: |
          mkdir -p "$JARELA_DB_DIR"
          nohup npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for /api/v1/health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$JARELA_E2E_BASE_URL/api/v1/health" >/dev/null; then
              echo "server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy in 60s"
          tail -n 200 server.log || true
          exit 1

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
          retention-days: 14

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) 2>/dev/null || true
          fi
