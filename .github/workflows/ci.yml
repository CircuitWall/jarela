name: CI

on:
  # Run full validation on PRs and a light sanity pass on post-merge main.
  # Feature-branch pushes are intentionally excluded: the pull_request run
  # already validates every update, and tag pushes are handled by release.yml.
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

# Cancel in-flight CI for the same ref when a newer commit lands. Keeps
# PR queues short and stops us paying for stale runs after a force-push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventions:
    name: Commit and PR conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-git-conventions.mjs --subject-env PR_TITLE --label "pull request title"

      - name: Check pushed commit subjects
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            RANGE="$SHA^..$SHA"
          else
            RANGE="$BEFORE..$SHA"
          fi
          node scripts/check-git-conventions.mjs --range "$RANGE" --label "commit subject"

  changes:
    # Detect whether the PR / push touched anything that could affect the
    # built app. PR jobs use this to avoid expensive retests for release
    # metadata-only changes; push-to-main keeps only conventions + security
    # scans because the merge was already gated by PR CI.
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      app:               ${{ steps.filter.outputs.app }}
      deps:              ${{ steps.filter.outputs.deps }}
      packages:          ${{ steps.filter.outputs.packages }}
      pkg_meta:          ${{ steps.filter.outputs.pkg_meta }}
      workflows:         ${{ steps.filter.outputs.workflows }}
      release_meta_only: ${{ steps.release-meta.outputs.only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
              - 'components/**'
              - 'contexts/**'
              - 'hooks/**'
              - 'lib/**'
              - 'public/**'
              - 'tests/**'
              - 'api/**'
              - 'scripts/**'
              - 'packages/**'
              - 'next.config.ts'
              - 'tsconfig.json'
              - 'playwright.config.ts'
              - 'package.json'
              - 'package-lock.json'
            deps:
              - 'package.json'
              - 'package-lock.json'
            packages:
              - 'packages/**'
            pkg_meta:
              - 'package.json'
              - 'packages/*/package.json'
              - 'scripts/rewrite-workspace-deps.mjs'
              - 'scripts/check-npm-package.mjs'
            workflows:
              - '.github/workflows/**'

      - name: Detect release metadata-only change
        id: release-meta
        env:
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [[ "$BEFORE" =~ ^0+$ ]]; then
            range="$HEAD_SHA^..$HEAD_SHA"
          else
            range="$BEFORE..$HEAD_SHA"
          fi

          node - "$range" <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const range = process.argv[2];
          const allowed = new Set(['CHANGELOG.md', 'package.json', 'package-lock.json']);
          const changed = execFileSync('git', ['diff', '--name-only', range], { encoding: 'utf8' })
            .trim()
            .split(/\r?\n/)
            .filter(Boolean);
          let only = changed.length > 0 && changed.every((file) => allowed.has(file));

          for (const file of ['package.json', 'package-lock.json']) {
            if (!only || !changed.includes(file)) continue;
            const diff = execFileSync('git', ['diff', '-U0', range, '--', file], { encoding: 'utf8' });
            for (const line of diff.split(/\r?\n/)) {
              if (!/^[+-]/.test(line) || /^[+-]{3}/.test(line)) continue;
              if (!/^[-+]\s*"version":\s*"[^"]+",?$/.test(line)) only = false;
            }
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `only=${only ? 'true' : 'false'}\n`);
          console.log(`release_meta_only=${only ? 'true' : 'false'} changed=${changed.join(',') || '(none)'}`);
          NODE

  security:
    name: Security checks
    runs-on: ubuntu-latest
    needs: [changes]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Secrets scan uses only Node.js built-ins — no node_modules needed.
      # Runs unconditionally so every PR is checked, regardless of what changed.
      - name: Scan for secrets
        run: node scripts/scan-secrets.mjs --all

      - name: Scan for sensitive corporate terms
        run: node scripts/scan-sensitive-terms.mjs --all

      # Dependency audit and version-pin checks only matter when
      # package.json / package-lock.json changed. Skip on source-only PRs to
      # avoid a full `npm ci` just to run `npm audit`.
      - name: Setup Node
        if: needs.changes.outputs.deps == 'true' && needs.changes.outputs.release_meta_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: needs.changes.outputs.deps == 'true' && needs.changes.outputs.release_meta_only != 'true'
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/

      - name: Dependency audit and version gates
        if: needs.changes.outputs.deps == 'true' && needs.changes.outputs.release_meta_only != 'true'
        run: npm run security:audit && npm run security:link-preview

  build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    needs: [changes]
    # Expensive validation runs once, on PRs that touch runtime/package/test
    # surfaces. Skip docs-only, workflow-only, release-metadata-only, and
    # post-merge main repeats; release.yml rebuilds tagged app releases.
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.app == 'true' && needs.changes.outputs.release_meta_only != 'true' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify lockfile uses the public npm registry only
        # Tripwire: refuse to build if package-lock.json points at any
        # registry other than registry.npmjs.org. This caught the JFrog
        # mirror leak that broke main in May 2026 — see commit f40b31b.
        run: |
          bad=$(grep -oE '"resolved": "https://[^"]+"' package-lock.json \
                  | grep -v '"https://registry.npmjs.org/' || true)
          if [ -n "$bad" ]; then
            echo "::error::package-lock.json contains non-public registry URLs:"
            echo "$bad" | head -20
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (next build)
        run: npm run build

      - name: Route bundle security attestation
        run: npm run security:routes

      - name: Verify npm tarball contains runnable standalone bundle
        # Only relevant when packaging metadata changes (package.json,
        # workspace package.json files, or the dep-rewrite script).
        # Skipped on pure source/UI changes — the tarball structure doesn't
        # change and this step is expensive (~30–60s: npm pack + extract + build).
        if: needs.changes.outputs.pkg_meta == 'true'
        run: npm run test:package

      - name: Test workspaces (per-package vitest suites)
        # Only relevant when workspace package source files change.
        if: needs.changes.outputs.packages == 'true'
        run: npm run packages:test

      - name: Upload runnable standalone bundle
        # Downstream jobs (unit-coverage skips it, e2e reuses it) instead of
        # re-running `next build`. `npm start` reads from .next/standalone/,
        # which postbuild has already hydrated with public/ + .next/static.
        # include-hidden-files is required: the bundle has its own nested
        # .next/ (BUILD_ID, server/, static/) that v4 would otherwise strip
        # as a hidden path, leaving the standalone server unable to find the
        # production build at runtime.
        uses: actions/upload-artifact@v4
        with:
          name: next-standalone
          path: .next/standalone
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  unit-coverage:
    name: Unit coverage (>=80%)
    runs-on: ubuntu-latest
    needs: [build, changes]
    # Skip for doc-only, release-metadata-only, and post-merge main runs.
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.app == 'true' && needs.changes.outputs.release_meta_only != 'true' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/

      - name: Run unit coverage gate
        run: npm run test:coverage

      - name: Upload unit coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage/
          retention-days: 14

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [build, changes]
    # Skip the expensive browser suite when the change footprint can't affect
    # runtime behaviour, and on post-merge main where PR CI already ran it.
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.app == 'true' && needs.changes.outputs.release_meta_only != 'true' }}
    timeout-minutes: 30
    env:
      JARELA_DB_DIR: /tmp/jarela-e2e
      JARELA_E2E_BASE_URL: http://127.0.0.1:4312
      # JARELA_URL is read by test:live; point it at the same server.
      JARELA_URL: http://127.0.0.1:4312
      # The mock provider replaces real LLM calls so we don't need keys in CI.
      JARELA_ENABLE_MOCK_PROVIDER: "1"
      JARELA_DISABLE_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/

      - name: Resolve Playwright version
        id: pw
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright system deps (cache-hit branch)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Download runnable standalone bundle
        uses: actions/download-artifact@v4
        with:
          name: next-standalone
          path: .next/standalone

      - name: Start production server
        run: |
          mkdir -p "$JARELA_DB_DIR"
          nohup npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for /api/v1/health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$JARELA_E2E_BASE_URL/api/v1/health" >/dev/null; then
              echo "server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy in 60s"
          tail -n 200 server.log || true
          exit 1

      - name: Run live integration tests (no LLM)
        # Folded here from the former `integration` job — shares the server
        # instance already started above, saving a full redundant startup cycle.
        run: npm run test:live

      - name: Run Playwright tests with e2e coverage gate
        run: npm run test:e2e:coverage

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload e2e coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage
          path: coverage/
          retention-days: 14

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
          retention-days: 14

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) 2>/dev/null || true
          fi
