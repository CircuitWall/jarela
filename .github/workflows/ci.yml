name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        # keytar ships a prebuilt for linux-x64 so no native libsecret dev
        # headers are required on ubuntu-latest, but skip optional native
        # rebuilds anyway to keep this fast.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (next build)
        run: npm run build

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    env:
      # Force an ephemeral data dir so the suite never touches a user's
      # ~/.jarela. Cleared between runs by the runner anyway.
      JARELA_DB_DIR: ${{ runner.temp }}/jarela-ci
      # Tests target the started server on this port.
      JARELA_URL: http://127.0.0.1:4312
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start production server
        run: |
          mkdir -p "$JARELA_DB_DIR"
          nohup npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for /api/v1/health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$JARELA_URL/api/v1/health" >/dev/null; then
              echo "server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy in 60s"
          tail -n 200 server.log || true
          exit 1

      - name: Run live integration tests (no LLM)
        run: npm run test:live

      - name: Server log on failure
        if: failure()
        run: tail -n 400 server.log || true

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) 2>/dev/null || true
          fi
