name: CI

on:
  # Run on PRs (against any base) and on the post-merge commit on main.
  # We deliberately do NOT run on push to feature branches: that would
  # double up with the pull_request run on every push. The main run keeps
  # the README badge honest and acts as a final safety net after merge.
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

# Cancel in-flight CI for the same ref when a newer commit lands. Keeps
# PR queues short and stops us paying for stale runs after a force-push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Detect whether the PR / push touched anything that could affect the
    # built app. Doc-only, CHANGELOG-only, or release-workflow-only changes
    # skip the expensive e2e job below. The other jobs (lint/build,
    # integration) are cheap enough that we always run them.
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
              - 'components/**'
              - 'contexts/**'
              - 'hooks/**'
              - 'lib/**'
              - 'public/**'
              - 'tests/**'
              - 'api/**'
              - 'scripts/**'
              - 'next.config.ts'
              - 'tsconfig.json'
              - 'playwright.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/

      - name: Run security gates
        run: npm run security:ci

  build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    # Runs in parallel with `security` — they share only `npm ci` and neither
    # gates the other. Cuts ~25s off the critical path on a clean PR.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify lockfile uses the public npm registry only
        # Tripwire: refuse to build if package-lock.json points at any
        # registry other than registry.npmjs.org. This caught the JFrog
        # mirror leak that broke main in May 2026 — see commit f40b31b.
        run: |
          bad=$(grep -oE '"resolved": "https://[^"]+"' package-lock.json \
                  | grep -v '"https://registry.npmjs.org/' || true)
          if [ -n "$bad" ]; then
            echo "::error::package-lock.json contains non-public registry URLs:"
            echo "$bad" | head -20
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (next build)
        run: npm run build

      - name: Route bundle security attestation
        run: npm run security:routes

      - name: Verify npm tarball contains runnable standalone bundle
        run: npm run test:package

      - name: Test workspaces (per-package vitest suites)
        run: npm run packages:test

      - name: Upload runnable standalone bundle
        # Downstream jobs (integration, e2e) reuse this instead of re-running
        # `next build`. `npm start` reads from .next/standalone/, which
        # postbuild has already hydrated with public/ + .next/static.
        # include-hidden-files is required: the bundle has its own nested
        # .next/ (BUILD_ID, server/, static/) that v4 would otherwise strip
        # as a hidden path, leaving the standalone server unable to find the
        # production build at runtime.
        uses: actions/upload-artifact@v4
        with:
          name: next-standalone
          path: .next/standalone
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    env:
      # Force an ephemeral data dir so the suite never touches a user's
      # ~/.jarela. /tmp is writable on ubuntu-latest and wiped between runs.
      JARELA_DB_DIR: /tmp/jarela-ci
      # Tests target the started server on this port.
      JARELA_URL: http://127.0.0.1:4312
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/

      - name: Download runnable standalone bundle
        uses: actions/download-artifact@v4
        with:
          name: next-standalone
          path: .next/standalone

      - name: Start production server
        run: |
          mkdir -p "$JARELA_DB_DIR"
          nohup npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for /api/v1/health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$JARELA_URL/api/v1/health" >/dev/null; then
              echo "server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy in 60s"
          tail -n 200 server.log || true
          exit 1

      - name: Run live integration tests (no LLM)
        run: npm run test:live

      - name: Server log on failure
        if: failure()
        run: tail -n 400 server.log || true

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) 2>/dev/null || true
          fi

  unit-coverage:
    name: Unit coverage (>=80%)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/

      - name: Run unit coverage gate
        run: npm run test:coverage

      - name: Upload unit coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage/
          retention-days: 14

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [build, changes]
    # Skip the expensive browser suite when the change footprint can't
    # affect runtime behaviour (docs, CHANGELOG, release workflow, etc.).
    # `if` on `needs.changes.outputs.app == 'true'` keeps the job result
    # as "skipped" rather than failing — branch protection treats skipped
    # required checks as passing.
    if: ${{ needs.changes.outputs.app == 'true' }}
    timeout-minutes: 30
    env:
      JARELA_DB_DIR: /tmp/jarela-e2e
      JARELA_E2E_BASE_URL: http://127.0.0.1:4312
      # The mock provider replaces real LLM calls so we don't need keys in CI.
      JARELA_ENABLE_MOCK_PROVIDER: "1"
      JARELA_DISABLE_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/

      - name: Resolve Playwright version
        id: pw
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright system deps (cache-hit branch)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Download runnable standalone bundle
        uses: actions/download-artifact@v4
        with:
          name: next-standalone
          path: .next/standalone

      - name: Start production server
        run: |
          mkdir -p "$JARELA_DB_DIR"
          nohup npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for /api/v1/health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$JARELA_E2E_BASE_URL/api/v1/health" >/dev/null; then
              echo "server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy in 60s"
          tail -n 200 server.log || true
          exit 1

      - name: Run Playwright tests with e2e coverage gate
        run: npm run test:e2e:coverage

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload e2e coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage
          path: coverage/
          retention-days: 14

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
          retention-days: 14

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) 2>/dev/null || true
          fi
