version: 2
updates:
  # Keep workflow actions current in one grouped weekly PR. Titles come out
  # as "ci(deps): bump the actions group with N updates", which passes
  # scripts/check-git-conventions.mjs. The Playwright container image is
  # pinned to package-lock.json by scripts/check-ci-workflows.mjs instead.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope

  # Documentation site toolchain pinned in requirements-docs.txt.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docs:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  # npm dependencies for the app and every workspace package (one lockfile).
  # Security fixes, patches, and minors land in one grouped weekly PR; majors
  # arrive as individual PRs because they need review. Playwright is bumped by
  # hand together with the CI container image, which check-ci-workflows.mjs
  # requires to match the locked @playwright/test version.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@playwright/test"
      - dependency-name: "playwright"
      - dependency-name: "playwright-core"
    commit-message:
      prefix: build
      include: scope
