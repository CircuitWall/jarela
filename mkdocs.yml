site_name: Jarela
site_description: Local-first multi-agent desktop interface for LangGraph
site_url: https://circuitwall.github.io/jarela/
repo_url: https://github.com/CircuitWall/jarela
repo_name: CircuitWall/jarela
edit_uri: edit/main/docs/
use_directory_urls: true
extra_css:
  - assets/custom.css

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - meta
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Getting started:
      - Install: INSTALL.md
      - Development: DEVELOPMENT.md
  - Architecture:
      - Overview: ARCHITECTURE.md
      - API: api.md
  - Extending:
      - Extension surfaces: EXTENDING.md
      - Provider policy: PRICING_EXTRACTION_POLICY.md
  - Operations:
      - Demo Gmail: DEMO_GMAIL_CONNECT.md
      - UI hook API: ui-hook-api.md

plugins:
  - search
