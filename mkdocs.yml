site_name: Jarela
site_description: Local-first multi-agent desktop interface for LangGraph
site_url: https://circuitwall.github.io/jarela/
repo_url: https://github.com/CircuitWall/jarela
repo_name: CircuitWall/jarela
edit_uri: edit/main/docs/
use_directory_urls: true
extra_css:
  - assets/custom.css

theme:
  name: material
  variant: classic
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - meta
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Getting started:
      - Install: INSTALL.md
      - First run: FIRST_RUN.md
      - Development: DEVELOPMENT.md
  - Architecture:
      - Overview: ARCHITECTURE.md
      - Post-3.0 minor-upgrade plan: POST_3_DIRECTION.md
      - Core and extensions: adr/0111-dependable-core-user-owned-extensions.md
      - JavaScript skill execution (proposed ADR): adr/0112-checked-javascript-skill-execution.md
      - API: api.md
  - Extending:
      - Extension surfaces: EXTENDING.md
      - Provider policy: PRICING_EXTRACTION_POLICY.md
  - Operations:
      - Overview: OPERATIONS.md
      - Demo Gmail: DEMO_GMAIL_CONNECT.md
      - UI hook API: ui-hook-api.md
      - Release notes for users: CHANGELOG.md
      - Project history: PROJECT_HISTORY.md
      - Agent upgrade instructions: adoption/index.md

plugins:
  - search
